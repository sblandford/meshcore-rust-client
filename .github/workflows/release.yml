name: Release

# Push a tag like v0.2.0 to build every package and publish a GitHub release.
# "Run workflow" (manual dispatch) builds the same packages as artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_ID: io.github.sblandford.MeshCoreClient
  APP_NAME: Rust Desktop Client for MeshCore
  BIN: meshcore-rust-client

jobs:
  linux:
    name: Linux (portable tar.gz)
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distributions
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Check third-party notices match Cargo.lock
        run: python3 tools/third_party_notices.py --check
      - name: Test
        run: |
          set +e
          cargo test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # Surface failures as annotations (readable without downloading logs).
          grep -E "panicked|FAILED|^error" test.log | head -20 | while read -r l; do echo "::error::$l"; done
          exit $code
      - run: cargo build --release
      - name: Package
        run: |
          d=$BIN-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p "$d/icons" && cp target/release/$BIN README.md INSTALL.md LICENSE THIRD-PARTY-NOTICES.txt "$d/"
          cp packaging/linux/$APP_ID.desktop "$d/" && cp packaging/icons/meshcore-256.png "$d/icons/$APP_ID.png"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "meshcore-rust-client-*.tar.gz" }

  flatpak:
    name: Linux (Flatpak)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        timeout-minutes: 15
        run: |
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            sudo timeout 300 apt-get $apt_opts update -q && \
              sudo timeout 600 apt-get $apt_opts install -y -q flatpak flatpak-builder && break
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep 20
          done
          command -v flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo build-dir packaging/linux/$APP_ID.yml
      - name: Bundle
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "$BIN-${GITHUB_REF_NAME}-linux-x86_64.flatpak" $APP_ID master
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: "meshcore-rust-client-*.flatpak" }

  windows:
    name: Windows (MSI + portable zip)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable; rustup default stable
      - name: Test
        run: |
          cargo test 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          Select-String -Path test.log -Pattern 'panicked|FAILED|^error' | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          exit $code
      - run: cargo build --release
      - name: Portable zip
        run: |
          $d = "$env:BIN-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item "target/release/$env:BIN.exe", README.md, INSTALL.md, LICENSE, THIRD-PARTY-NOTICES.txt $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - name: MSI installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          # The installer's licence page needs RTF.
          $t = (Get-Content LICENSE -Raw).Replace('\', '\\').Replace('{', '\{').Replace('}', '\}') -replace "`r?`n", "\par`r`n"
          New-Item -ItemType Directory build -Force | Out-Null
          "{\rtf1\ansi\deff0{\fonttbl{\f0 Segoe UI;}}\fs16 $t}" | Set-Content -Encoding ascii build/license.rtf
          $out = & wix build packaging/windows/meshcore.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d Version=$ver -d Root="$PWD" -d Exe="$PWD\target\release\$env:BIN.exe" -d LicenseRtf="$PWD\build\license.rtf" `
            -o "$env:BIN-$env:GITHUB_REF_NAME-windows-x86_64.msi" 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          # Surface WiX diagnostics as annotations (readable without downloading logs).
          $out | Where-Object { "$_" -match '(error|warning) WIX' } | ForEach-Object { Write-Host "::warning::$_" }
          if ($code -ne 0) { Write-Host "::error::wix build failed with exit code $code"; exit $code }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            meshcore-rust-client-*.msi
            meshcore-rust-client-*.zip

  macos:
    name: macOS (universal DMG)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: |
          set +e
          cargo test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          grep -E "panicked|FAILED|^error" test.log | head -20 | while read -r l; do echo "::error::$l"; done
          exit $code
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: App bundle and DMG
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="dmg/$APP_NAME.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/$BIN" \
            target/aarch64-apple-darwin/release/$BIN target/x86_64-apple-darwin/release/$BIN
          sed "s/@VERSION@/$ver/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp packaging/icons/meshcore.icns "$app/Contents/Resources/meshcore.icns"
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          cp INSTALL.md LICENSE THIRD-PARTY-NOTICES.txt dmg/
          hdiutil create -volname "$APP_NAME $ver" -srcfolder dmg -ov -format UDZO "$BIN-${GITHUB_REF_NAME}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "meshcore-rust-client-*.dmg" }

  release:
    needs: [linux, flatpak, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=${GITHUB_REF_NAME}
          cat > notes.md <<EOF
          **Rust Desktop Client for MeshCore**: a native desktop app for MeshCore companion radios over USB serial
          or Bluetooth LE.

          > Independent open-source software, compatible with MeshCore radios. Not affiliated with or endorsed by
          > the MeshCore project.

          ## Downloads
          | Platform | Installer | Portable |
          |---|---|---|
          | Windows 10/11 (x86_64) | \`$BIN-$t-windows-x86_64.msi\` | \`$BIN-$t-windows-x86_64.zip\` |
          | macOS 11+ (Apple Silicon and Intel) | \`$BIN-$t-macos-universal.dmg\` | |
          | Linux (x86_64) | \`$BIN-$t-linux-x86_64.flatpak\` | \`$BIN-$t-linux-x86_64.tar.gz\` |

          See [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/$t/INSTALL.md) for step-by-step installation
          instructions, including the first-run security prompts for these unsigned packages.
          Verify downloads with \`SHA256SUMS.txt\`. Licensed under the GNU GPL v3; third-party licences are listed in
          \`THIRD-PARTY-NOTICES.txt\`, which is included in every package.

          You are responsible for using radio settings (frequency, power, duty cycle) that are legal where you are.
          EOF
          gh release create "$t" dist/* --title "Rust Desktop Client for MeshCore $t" --notes-file notes.md --generate-notes
