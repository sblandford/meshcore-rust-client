name: Release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          d=meshcore-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$d" && cp target/${{ matrix.target }}/release/meshcore README.md LICENSE "$d/"
          tar czf "$d.tar.gz" "$d"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "meshcore-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/${{ matrix.target }}/release/meshcore.exe, README.md, LICENSE $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          d=meshcore-${{ github.ref_name }}-${{ matrix.name }}
          app="$d/MeshCore.app"
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p "$app/Contents/MacOS"
          cp target/${{ matrix.target }}/release/meshcore "$app/Contents/MacOS/meshcore"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MeshCore</string>
            <key>CFBundleDisplayName</key><string>MeshCore</string>
            <key>CFBundleIdentifier</key><string>io.github.sblandford.meshcore-client</string>
            <key>CFBundleExecutable</key><string>meshcore</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>CFBundleVersion</key><string>${ver}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSBluetoothAlwaysUsageDescription</key><string>MeshCore connects to your companion radio over Bluetooth.</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE "$d/"
          ditto -c -k --keepParent "$d" "$d.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            meshcore-*.tar.gz
            meshcore-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Native desktop client for MeshCore companion radios over USB serial or Bluetooth LE.

          ## Downloads
          | Platform | File |
          |---|---|
          | Linux x86_64 | `meshcore-*-linux-x86_64.tar.gz`: extract and run `./meshcore` |
          | Windows 10/11 x86_64 | `meshcore-*-windows-x86_64.zip`: extract and run `meshcore.exe` |
          | macOS Apple Silicon | `meshcore-*-macos-arm64.zip`: contains `MeshCore.app` |
          | macOS Intel | `meshcore-*-macos-x86_64.zip`: contains `MeshCore.app` |

          The binaries are not signed with a paid certificate:
          - **Windows:** SmartScreen may warn. Click *More info › Run anyway*.
          - **macOS:** the app is ad-hoc signed only. Right-click › *Open* the first time, or run
            `xattr -dr com.apple.quarantine MeshCore.app`.
          - **Linux:** USB access needs membership of the `dialout` group (`uucp` on some distributions).
            Bluetooth needs BlueZ.

          Verify downloads with `SHA256SUMS.txt`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "MeshCore desktop client $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
